name: chelnok_boxing_timer
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  audioplayers: ^6.7.1
  cupertino_native: ^0.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Alata
      fonts:
        - asset: assets/Alata/Alata-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logoPNGthousand.png

flutter_native_splash:
  color: "#090B0F"
  image: assets/images/logoPNGthousand.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#090B0F"
    image: assets/images/logoPNGthousand.png
