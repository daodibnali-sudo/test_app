name: chelnok_boxing_timer
description: "A professional boxing timer for fighters with customizable rounds, sound announcements, and workout tracking."
publish_to: 'none'
version: 1.0.0+9


environment:
  sdk: ^3.12.0

dependencies:
  audioplayers: ^6.7.1
  cupertino_native: ^0.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_tts: ^4.2.5
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  chelnok_vibrate:
    path: packages/chelnok_vibrate
  wakelock_plus: ^1.6.1
  flutter_local_notifications: ^22.0.1
  purchases_flutter: ^10.4.0
  purchases_ui_flutter: ^10.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  


flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
  fonts:
    - family: Alata
      fonts:
        - asset: assets/Alata/Alata-Regular.ttf
